<mat-sidenav-container class="container">

  <mat-sidenav #drawer mode="over" class="mobile-menu">
    <button mat-button routerLink="/pokedex" (click)="drawer.close()">Pokédex</button>
    <button mat-button routerLink="/random" (click)="drawer.close()">Pokémon aléatoire</button>
  </mat-sidenav>

  <mat-sidenav-content>

    <mat-toolbar color="primary" class="navbar">
      <button mat-icon-button class="burger" (click)="drawer.toggle()">
        <mat-icon>menu</mat-icon>
      </button>

      <span class="title">Pokédash</span>

      <span class="spacer"></span>

      <nav class="desktop-menu">
        <button mat-button routerLink="/pokedex">Pokédex</button>
        <button mat-button routerLink="/random">Pokémon aléatoire</button>
      </nav>
    </mat-toolbar>

    <main class="content">
      <router-outlet></router-outlet>
    </main>

  </mat-sidenav-content>

</mat-sidenav-container>
