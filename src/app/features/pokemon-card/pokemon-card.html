<button mat-button (click)="goBack()">Retour</button>

<mat-card class="pokemon-card" [style.background]="bgColor" *ngIf="!loading(); else loadingTpl">
  <mat-card-header>
    <mat-card-title>{{ pokemon().name | titlecase }}</mat-card-title>
    <mat-card-subtitle>#{{ pokemon().id }}</mat-card-subtitle>
  </mat-card-header>

  <img
    mat-card-image
    [src]="pokemon().sprites?.other?.['official-artwork']?.front_default || pokemon().sprites?.front_default"
    alt="{{ pokemon().name }}"
  />

  <mat-card-content>
    <section class="types">
      <app-type-chip *ngFor="let t of pokemon().types || []" [type]="t.type.name"></app-type-chip>
    </section>

    <section class="stats">
      <div class="stat" *ngFor="let s of pokemon().stats || []">
        <span>{{ s.stat.name | titlecase }}</span>
        <mat-progress-bar mode="determinate" [value]="s.base_stat"></mat-progress-bar>
      </div>
    </section>
  </mat-card-content>

  <mat-card-actions>
    <button mat-raised-button color="primary" (click)="loadRandomPokemon()">Nouveau Pokémon</button>
  </mat-card-actions>
</mat-card>

<ng-template #loadingTpl>
  <app-loader></app-loader>
</ng-template>
